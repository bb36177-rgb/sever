<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบผู้ดูแลระบบ - ชิงหลงเซิฟ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #080203;
            --surface-card: #1f0b0e;
            --primary-red: #8b0000;
            --accent-gold: #d4af37;
            --text-light: #ffffff;
            --text-muted: #e6d58c;
            --border-gold: rgba(212, 175, 55, 0.4);
            --shadow-gold: 0 0 25px rgba(212, 175, 55, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 50% 0%, #1a0508 0%, var(--bg-deep) 70%);
            padding: 1.5rem 1rem;
        }

        .login-card {
            background: var(--surface-card);
            border: 2px solid var(--accent-gold);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-gold);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge-title {
            color: var(--accent-gold);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        h1 {
            color: var(--text-light);
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* ปุ่มกลับหน้าหลักแบบในรูป */
        .back-main-btn {
            display: inline-block;
            background: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--border-gold);
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.8rem;
            transition: 0.3s;
        }

        .back-main-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--accent-gold);
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: var(--accent-gold);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-gold);
            color: #fff;
            padding: 14px 16px;
            border-radius: 12px;
            outline: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #ffea79;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .gold-btn {
            background: linear-gradient(135deg, #ffea79, var(--accent-gold), #aa771c);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
            font-size: 1rem;
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
        }

        .gold-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--accent-gold);
            filter: brightness(1.1);
        }

        #error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="badge-title">🛡️ ADMIN SYSTEM</div>
        <h1>เข้าสู่ระบบสำหรับผู้ดูแล</h1>
        <p>จัดการและตรวจสอบข้อมูลของ ชิงหลงเซิฟ (Ching Long Server) ได้อย่างเต็มรูปแบบ</p>

        <!-- ปุ่มกลับหน้าหลักวางไว้ด้านบนแบบในรูปตัวอย่าง -->
        <a href="index.html" class="back-main-btn">← กลับหน้าหลัก</a>

        <form id="loginForm">
            <div class="form-group">
                <label>รหัสผู้ดูแล</label>
                <input type="password" id="admin-password" placeholder="กรอกรหัสผ่าน..." required autofocus>
            </div>
            <div id="error-msg">❌ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</div>
            <button type="submit" class="gold-btn">เข้าสู่แดชบอร์ด</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('admin-password').value;
            const correctPassword = "bb-36177-banbung";

            if (password === correctPassword) {
                localStorage.setItem('is_admin_logged', 'true');
                window.location.href = 'admin_dashboard.html'; 
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('admin-password').style.borderColor = '#ff4d4d';
            }
        });
    </script>
</body>
</html>
